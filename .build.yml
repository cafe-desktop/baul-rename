##########################################################
# THE FOLLOWING LINES IS USED BY docker-build
##########################################################
requires:
  debian:
    # Useful URL: https://github.com/cafe-desktop/debian-packages
    - aptitude
    - git
    - gdebi
    - expect #required for unbuffer
    - python3
    - python3-polib
    - python3-setuptools

build_scripts:
  - ./debrepo-install
  - git clone --depth 1 https://github.com/cafe-desktop/debian-packages -b gh-pages tmp-install
  - cd tmp-install
  - aptitude -y install `grep ^Package: Packages | cut -d' ' -f2 | tr '\n' ' '`
